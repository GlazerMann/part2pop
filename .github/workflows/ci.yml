name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "features/**"
      - "debug/**"
  pull_request:
    branches: [main]
  schedule:
    # Catch incompatibilities introduced by the project's unpinned dependencies.
    - cron: "19 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install part2pop and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check

      - name: Run unit tests
        if: matrix.python-version != '3.14'
        run: python -m pytest tests/unit

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.14'
        run: >-
          python -m pytest tests/unit
          --cov=part2pop
          --cov-config=.coveragerc
          --cov-report=xml
          --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration-tests:
    name: Build and test wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check

      - name: Test the installed wheel
        run: |
          mv src "${RUNNER_TEMP}/part2pop-src"
          python -c "import part2pop; print(f'Testing {part2pop.__file__}')"
          python -m pytest tests/integration
